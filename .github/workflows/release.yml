# タグ（v0.2.0、v0.2.0-beta.1 など）を push すると、4 種類（Windows x64 / ARM64、Mac Apple シリコン / Intel）をビルドし、
# Velopack でインストーラーと更新用のパッケージを作って、このリポジトリの Releases に置く。アプリの自動更新はこの Releases を見る。
# 版の唯一の元はタグ。-beta などの付いたタグはプレリリースになり、プレリリースの版で動いているアプリだけが受け取る。
# コード署名はしない（Mac は Velopack の簡易署名のみ）。アクションはコミットの SHA で固定する。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  PACK_ID: HatchSystem.AnomalyStudio
  VPK_VERSION: 1.2.158
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: build (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, exe: AnomalyStudio.exe }
          - { rid: win-arm64, os: windows-latest, exe: AnomalyStudio.exe }
          - { rid: osx-arm64, os: macos-latest, exe: AnomalyStudio }
          - { rid: osx-x64, os: macos-latest, exe: AnomalyStudio }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: 版をタグから決める
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          prefix="${tag%%-*}"
          suffix=""
          if [[ "$tag" == *-* ]]; then suffix="${tag#*-}"; fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          if [[ -n "$suffix" ]]; then echo "pre=--pre" >> "$GITHUB_OUTPUT"; else echo "pre=" >> "$GITHUB_OUTPUT"; fi

      - name: vpk を入れる
        run: dotnet tool install -g vpk --version "$VPK_VERSION"

      - name: 単体テスト
        if: matrix.rid == 'win-x64'
        run: dotnet test --project AnomalyStudio.Core.Tests/AnomalyStudio.Core.Tests.csproj -c Release

      - name: 発行（自己完結）
        run: >
          dotnet publish AnomalyStudio/AnomalyStudio.csproj -f net10.0-desktop -r "${{ matrix.rid }}" -c Release --self-contained
          -p:VersionPrefix="${{ steps.version.outputs.prefix }}" -p:VersionSuffix="${{ steps.version.outputs.suffix }}"
          -o publish

      - name: ライセンスを同梱する
        run: cp LICENSE.md THIRD-PARTY-NOTICES.md publish/

      - name: アイコンを用意する（Windows）
        if: runner.os == 'Windows'
        run: |
          icon="$(find AnomalyStudio/obj -name icon.ico | head -n 1)"
          echo "ICON_ARG=${icon:+--icon $icon}" >> "$GITHUB_ENV"

      - name: アイコンを用意する（Mac）
        if: runner.os == 'macOS'
        run: |
          mkdir -p AnomalyStudio.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size AnomalyStudio/Assets/Images/anomalystudio-logo.png --out AnomalyStudio.iconset/icon_${size}x${size}.png > /dev/null
            double=$((size * 2))
            sips -z $double $double AnomalyStudio/Assets/Images/anomalystudio-logo.png --out AnomalyStudio.iconset/icon_${size}x${size}@2x.png > /dev/null
          done
          iconutil -c icns AnomalyStudio.iconset -o AnomalyStudio.icns
          echo "ICON_ARG=--icon AnomalyStudio.icns" >> "$GITHUB_ENV"

      - name: 前の版を取得する（差分の更新パッケージ用。初回は無くてよい）
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --channel "${{ matrix.rid }}"
          --token "$GITHUB_TOKEN" ${{ steps.version.outputs.pre }} -o releases

      - name: パッケージを作る
        run: >
          vpk pack --packId "$PACK_ID" --packVersion "${{ steps.version.outputs.version }}" --packDir publish
          --mainExe "${{ matrix.exe }}" --packTitle AnomalyStudio --packAuthors HatchSystem
          --channel "${{ matrix.rid }}" --runtime "${{ matrix.rid }}" $ICON_ARG -o releases

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: releases-${{ matrix.rid }}
          path: releases/
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: vpk を入れる
        run: dotnet tool install -g vpk --version "$VPK_VERSION"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: releases-*
          path: artifacts

      - name: Releases に置く（4 種類を 1 つのリリースにまとめる）
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pre=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then pre="--pre"; fi
          for rid in win-x64 win-arm64 osx-arm64 osx-x64; do
            vpk upload github --repoUrl "https://github.com/${GITHUB_REPOSITORY}" --channel "$rid" \
              --token "$GITHUB_TOKEN" --tag "$GITHUB_REF_NAME" --releaseName "AnomalyStudio ${GITHUB_REF_NAME}" \
              --merge --publish $pre -o "artifacts/releases-$rid"
          done

      - name: リリースノートを書く
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## インストール

          [導入マニュアル](https://github.com/HatchSystem/anomaly-studio-oss/blob/main/docs/INSTALL.md) の手順に従って、PC の種類に合うファイルをダウンロードしてください。

          | 種類 | ファイル | 動作確認 |
          |---|---|---|
          | Windows 10 / 11（x64） | `HatchSystem.AnomalyStudio-win-x64-Setup.exe` | 確認済み |
          | Windows 11（ARM） | `HatchSystem.AnomalyStudio-win-arm64-Setup.exe` | ビルドのみ・未検証 |
          | Mac（Apple シリコン） | `HatchSystem.AnomalyStudio-osx-arm64-Setup.pkg` | ビルドのみ・未検証 |
          | Mac（Intel） | `HatchSystem.AnomalyStudio-osx-x64-Setup.pkg` | ビルドのみ・未検証 |

          コード署名をしていないため、初回のインストールで警告が出ます。インストール済みの場合は、アプリが自動で更新します。
          それ以外のファイル（nupkg、Portable.zip、releases.*.json など）は自動更新用です。

          非商用の利用に限ります（PolyForm Strict License 1.0.0）。
          EOF
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
